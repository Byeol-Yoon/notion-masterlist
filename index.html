
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stories & Universes</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    background: transparent !important;
  }

  body {
    padding: 12px;
    font-family: -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
  }

  /* COLLECTION */

  .collection {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }

  /* GENERAL CHIP STYLE */

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 10px 16px;
    border-radius: 50px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 550;
    letter-spacing: 0.1px;
    border: 1px solid transparent;
    transition: all 0.25s ease;
    white-space: nowrap;
  }

  .chip .icon {
    font-size: 15px;
    line-height: 1;
  }

  .chip:hover {
    transform: translateY(-3px);
    filter: brightness(0.97);
    box-shadow: 0 5px 14px rgba(0,0,0,0.08);
  }

  .chip:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 3px;
  }

  /* LIGHT MODE */

  /* HYPNOS */
  .hypnos {
    background: #E8DDEB;
    color: #674D70;
  }

  /* MERMAID TALES */
  .mermaid {
    background: #DCE6EC;
    color: #405967;
  }

  /* IBASHO */
  .ibasho {
    background: #E4E9DB;
    color: #53613D;
  }

  /* WIZARDING WORLD */
  .wizarding {
    background: #EFE5D9;
    color: #70563F;
  }

  /* IDOLVERSE */
  .idolverse {
    background: #DDE3E9;
    color: #46596D;
  }

  /* MISCELLANEA */
  .miscellanea {
    background: #EBDDE0;
    color: #704650;
  }

  /* DARK MODE */

  @media (prefers-color-scheme: dark) {

    .hypnos {
      background: #403448;
      color: #E8D9EF;
    }

    .mermaid {
      background: #30404A;
      color: #D5E4ED;
    }

    .ibasho {
      background: #394333;
      color: #DFE9D5;
    }

    .wizarding {
      background: #493D32;
      color: #F0E0CC;
    }

    .idolverse {
      background: #35414D;
      color: #DCE6F0;
    }

    .miscellanea {
      background: #49343B;
      color: #EFD9DF;
    }

    .chip:hover {
      filter: brightness(1.2);
      box-shadow: 0 5px 14px rgba(0,0,0,0.25);
    }
  }

  /* RESPONSIVE */

  @media (max-width: 480px) {

    .collection {
      gap: 9px;
    }

    .chip {
      padding: 9px 13px;
      font-size: 12px;
    }
  }

</style>
</head>

<body>

<div class="collection">

  <!-- HYPNOS -->
  <a class="chip hypnos"
     href="PEGAR_ENLACE_HYPNOS"
     target="_blank"
     rel="noopener noreferrer">
    <span class="icon">☾</span>
    Hypnos
  </a>

  <!-- MERMAID TALES -->
  <a class="chip mermaid"
     href="PEGAR_ENLACE_MERMAID_TALES"
     target="_blank"
     rel="noopener noreferrer">
    <span class="icon">🐚</span>
    Mermaid Tales
  </a>

  <!-- IBASHO -->
  <a class="chip ibasho"
     href="PEGAR_ENLACE_IBASHO"
     target="_blank"
     rel="noopener noreferrer">
    <span class="icon">⌂</span>
    Ibasho
  </a>

  <!-- WIZARDING WORLD -->
  <a class="chip wizarding"
     href="PEGAR_ENLACE_WIZARDING_WORLD"
     target="_blank"
     rel="noopener noreferrer">
    <span class="icon">✧</span>
    Wizarding World
  </a>

  <!-- IDOLVERSE -->
  <a class="chip idolverse"
     href="PEGAR_ENLACE_IDOLVERSE"
     target="_blank"
     rel="noopener noreferrer">
    <span class="icon">♫</span>
    Idolverse
  </a>

  <!-- MISCELLANEA -->
  <a class="chip miscellanea"
     href="PEGAR_ENLACE_MISCELLANEA"
     target="_blank"
     rel="noopener noreferrer">
    <span class="icon">✎</span>
    Miscelánea
  </a>

</div>

</body>
</html>
