
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stories & Universes</title>

<style>
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    background: transparent !important;
  }

  body {
    padding: 12px;
    font-family: -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
  }

  .collection {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 10px 16px;
    border-radius: 50px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 550;
    letter-spacing: 0.1px;
    border: 1px solid transparent;
    transition: all 0.25s ease;
    white-space: nowrap;
  }

  .chip .icon {
    font-size: 15px;
    line-height: 1;
  }

  .chip:hover {
    transform: translateY(-3px);
    filter: brightness(0.97);
    box-shadow: 0 5px 14px rgba(0,0,0,0.08);
  }

  .chip:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 3px;
  }

  /* LIGHT MODE */

  .hypnos {
    background: #E8DDEB;
    color: #674D70;
  }

  .sireno {
    background: #DCE6EC;
    color: #405967;
  }

  .ibasho {
    background: #E4E9DB;
    color: #53613D;
  }

  .hogwarts {
    background: #EFE5D9;
    color: #70563F;
  }

  .cyberpunk {
    background: #DDE3E9;
    color: #46596D;
  }

  .caballeros {
    background: #EBDDE0;
    color: #704650;
  }

  /* DARK MODE */

  @media (prefers-color-scheme: dark) {

    .hypnos {
      background: #403448;
      color: #E8D9EF;
    }

    .sireno {
      background: #30404A;
      color: #D5E4ED;
    }

    .ibasho {
      background: #394333;
      color: #DFE9D5;
    }

    .hogwarts {
      background: #493D32;
      color: #F0E0CC;
    }

    .cyberpunk {
      background: #35414D;
      color: #DCE6F0;
    }

    .caballeros {
      background: #49343B;
      color: #EFD9DF;
    }

    .chip:hover {
      filter: brightness(1.2);
      box-shadow: 0 5px 14px rgba(0,0,0,0.25);
    }
  }

  /* RESPONSIVE */

  @media (max-width: 480px) {
    .collection {
      gap: 9px;
    }

    .chip {
      padding: 9px 13px;
      font-size: 12px;
    }
  }

</style>
</head>

<body>

<div class="collection">

  <a class="chip hypnos"
     href="PEGAR_ENLACE_NOTION_HYPNOS"
     target="_blank">
    <span class="icon">☾</span>
    Hypnos
  </a>

  <a class="chip sireno"
     href="PEGAR_ENLACE_NOTION_SIRENO"
     target="_blank">
    <span class="icon">🐚</span>
    Sireno · Byeol
  </a>

  <a class="chip ibasho"
     href="PEGAR_ENLACE_NOTION_IBASHO"
     target="_blank">
    <span class="icon">⌂</span>
    Ibasho
  </a>

  <a class="chip hogwarts"
     href="PEGAR_ENLACE_NOTION_HOGWARTS"
     target="_blank">
    <span class="icon">✧</span>
    Aster · Hogwarts
  </a>

  <a class="chip cyberpunk"
     href="PEGAR_ENLACE_NOTION_CYBERPUNK"
     target="_blank">
    <span class="icon">⌘</span>
    Cyberpunk Seoul
  </a>

  <a class="chip caballeros"
     href="PEGAR_ENLACE_NOTION_CABALLEROS"
     target="_blank">
    <span class="icon">⚔</span>
    Caballeros y príncipes
  </a>

</div>

</body>
</html>
